<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">

        <link

        <link rel="stylesheet" href="../assets/css/style.css">

    <body>
        <div class="screen">
            <header class="w-full bg-[#45CC00] text-white sticky top-0">
                <div class="text-2xl font-semibold flex items-center">
                    <a href="../" class="p-4 flex">
                        <img
                            class="h-6"
                            src="../assets/favicon-white.svg"
                            alt="Yeast Icon"

                    <button class="p-4 active:bg-black/50 relative" onclick="toggleNavigation()">

                    <div class="grow"></div>

                            viewBox="0 0 24 24"
                            fill="currentColor"
                            class="size-6"
                        >

                                fill-rule="evenodd"

            <main class="overflow-y-auto">

                <div class="h-14 flex gap-4 m-2 items-center">

                    >

                    </button>
                    <div
                        class="h-14 overflow-x-auto md:overflow-x-hidden flex gap-4 grow *:shrink-0"

                    >
                        <button
                            class="bg-gray-200 active:bg-gray-300 shadow-lg/25 border border-gray-300 rounded-lg h-full p-2 flex gap-2 items-center w-auto"

                        <button

                            <img src="../assets/favicon.svg" alt="">
                            <span>Lorem Ipsum Dolor Sit Amet</span>

                    </div>
                    <button

                        &gt;

                </div>
                <!-- END Category Button -->

                <!-- Grid Image -->
                <div
                    class="p-2 md:p-4 grid grid-cols-2 sm:grid-cols-5 gap-2 md:gap-4"

                    <div class="bg-gray-300 aspect-3/4"></div>

            <!-- Navigation Overlay -->

                <div class="bg-white w-full sm:w-lg m-auto p-4 flex flex-col gap-4 shadow-lg/25 rounded-lg duration-100 transition-all" style="scale: 80%;">
                    <a class="h-16 w-16 m-auto" href="../desain/">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">

                    id="floating-btn"
                    class="transition-all duration-50 m-4 p-4 pointer-events-auto rounded-full bg-gray-200 active:bg-gray-300 shadow-lg/25"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
